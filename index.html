<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업종료시간계산기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 28px;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            color: #1e293b;
            margin-bottom: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .btn-now {
            padding: 0 14px;
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
        }

        .btn-now:hover {
            background-color: #e2e8f0;
        }

        .btn-calc {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-calc:hover {
            background-color: #1d4ed8;
        }

        .result-box {
            margin-top: 24px;
            padding: 18px;
            background-color: #0f172a;
            color: #38bdf8;
            border-radius: 10px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>수업종료시간계산기</h1>

    <div class="input-group">
        <label for="startTime">수업 시작 시각</label>
        <input type="time" id="startTime">
    </div>

    <div class="input-group">
        <label for="currentTime">현재 시각</label>
        <div class="input-row">
            <input type="time" id="currentTime">
            <button class="btn-now" onclick="setCurrentTimeToNow()">지금</button>
        </div>
    </div>

    <div class="input-group">
        <div class="input-row">
            <div style="flex: 1;">
                <label for="currentSlide">현재 진행 슬라이드</label>
                <input type="number" id="currentSlide" placeholder="예: 15" min="1">
            </div>
            <div style="flex: 1;">
                <label for="totalSlide">전체 슬라이드</label>
                <input type="number" id="totalSlide" placeholder="예: 50" min="1">
            </div>
        </div>
    </div>

    <button class="btn-calc" onclick="calculate()">계산하기</button>

    <div class="result-box" id="resultBox"></div>
</div>

<script>
    // 현재 시각으로 자동 채우기 헬퍼 함수
    function setCurrentTimeToNow() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('currentTime').value = `${hours}:${minutes}`;
    }

    // 초기값 세팅 (현재 시각 기본 설정)
    setCurrentTimeToNow();

    function calculate() {
        const startTimeVal = document.getElementById('startTime').value;
        const currentTimeVal = document.getElementById('currentTime').value;
        const currentSlide = parseInt(document.getElementById('currentSlide').value, 10);
        const totalSlide = parseInt(document.getElementById('totalSlide').value, 10);
        const resultBox = document.getElementById('resultBox');

        if (!startTimeVal || !currentTimeVal || isNaN(currentSlide) || isNaN(totalSlide)) {
            alert('모든 입력값을 올바르게 입력해주세요.');
            return;
        }

        if (currentSlide <= 0 || totalSlide <= 0) {
            alert('슬라이드 수는 1장 이상이어야 합니다.');
            return;
        }

        if (currentSlide > totalSlide) {
            alert('현재 진행 슬라이드는 전체 슬라이드 수보다 클 수 없습니다.');
            return;
        }

        // 시간 파싱 (초 단위 계산)
        const today = new Date();
        const [startH, startM] = startTimeVal.split(':').map(Number);
        const [currH, currM] = currentTimeVal.split(':').map(Number);

        const startDate = new Date(today.getFullYear(), today.getMonth(), today.getDate(), startH, startM, 0);
        let currDate = new Date(today.getFullYear(), today.getMonth(), today.getDate(), currH, currM, 0);

        // 자정을 넘어간 경우 대응
        if (currDate < startDate) {
            currDate.setDate(currDate.getDate() + 1);
        }

        const elapsedSeconds = (currDate - startDate) / 1000;

        if (elapsedSeconds <= 0) {
            alert('현재 시각은 시작 시각보다 이후여야 합니다.');
            return;
        }

        // 비례식 계산
        const secondsPerSlide = elapsedSeconds / currentSlide;
        const remainingSlides = totalSlide - currentSlide;
        const remainingSeconds = secondsPerSlide * remainingSlides;

        // 예상 종료 시각
        const endDate = new Date(currDate.getTime() + remainingSeconds * 1000);

        // 포맷팅
        // 1. 장당 평균 시간
        const avgMin = Math.floor(secondsPerSlide / 60);
        const avgSec = Math.round(secondsPerSlide % 60);
        const avgTimeStr = `${avgMin}분 ${avgSec}초`;

        // 2. 남은 예상 시간
        const remTotalMin = Math.round(remainingSeconds / 60);
        const remHours = Math.floor(remTotalMin / 60);
        const remMinutes = remTotalMin % 60;
        const remTimeStr = remHours > 0 ? `${remHours}시간 ${remMinutes}분` : `${remMinutes}분`;

        // 3. 예상 종료 시간
        const endHour = endDate.getHours();
        const endMin = endDate.getMinutes();
        const endTimeStr = `${endHour}시 ${endMin}분`;

        // 출력 양식 구성
        const output = `*** 수업종료시간계산기 ***\n\n` +
            `장당 평균 시간: ${avgTimeStr}\n` +
            `진행 상황 : ${currentSlide} / ${totalSlide}\n` +
            `남은 슬라이드: ${remainingSlides}장\n` +
            `남은 예상 시간: ${remTimeStr}\n` +
            `예상 종료 시간: ${endTimeStr}`;

        resultBox.textContent = output;
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>
